name: Linux

on:
  push:
    branches: [linux]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # O mais antigo com suporte: o binário roda em distros com glibc 2.35+
    # (Ubuntu 22.04, Debian 12, Fedora 36…).
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libdbus-1-dev libpulse-dev libfreetype-dev libfontconfig1-dev libharfbuzz-dev fonts-noto-core imagemagick

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --release

      - name: Capturas desenhadas pelo código (FreeType + HarfBuzz)
        env:
          TASKBEAT_SHOTS_DIR: ${{ github.workspace }}/shots
          TASKBEAT_LANG: pt
        run: cargo test --release notch_shots -- --ignored --nocapture

      - name: Pacotes (.deb e AppImage)
        run: ./build-linux.sh

      - name: Conferência do pacote
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          ldd target/release/taskbeat
          objdump -T target/release/taskbeat | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          ls -l target/release/taskbeat

      - uses: actions/upload-artifact@v4
        with:
          name: Taskbeat-Linux
          path: |
            dist/*.deb
            dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/taskbeat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-code-shots
          path: shots/

  shots:
    # O app de verdade numa distro atual: Sway sem tela (Wayland com
    # layer-shell) e Xvfb + picom (X11), com um player de teste no MPRIS.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: Taskbeat-Linux
          path: dist

      - name: Dependências (só as de execução e as de teste)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libdbus-1-3 libpulse0 libfreetype6 libfontconfig1 libharfbuzz0b fonts-noto-core \
            sway grim wlrctl xvfb picom xdotool imagemagick pulseaudio pulseaudio-utils dbus-x11 python3-dbus python3-gi
          chmod +x bin/taskbeat

      - name: Pacote .deb instala
        run: |
          sudo apt-get install -y -q ./dist/*.deb
          dpkg -s taskbeat | head -5
          desktop-file-validate /usr/share/applications/io.github.lu1sgabriel.taskbeat.desktop || true

      - name: Prints e teste de ponta a ponta
        run: dbus-run-session -- bash linux/ci-shots.sh shots bin/taskbeat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shots
          path: shots/
