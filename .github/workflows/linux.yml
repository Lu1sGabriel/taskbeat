name: Linux

on:
  push:
    branches: [linux]
  pull_request:
  workflow_dispatch:

# Só leitura: este workflow não publica nada.
permissions:
  contents: read

jobs:
  build:
    # O mais antigo com suporte: o binário roda em distros com glibc 2.35+
    # (Ubuntu 22.04, Debian 12, Fedora 36…).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libdbus-1-dev libpulse-dev libfreetype-dev libfontconfig1-dev libharfbuzz-dev fonts-noto-core imagemagick

      # A versão vem do rust-toolchain.toml (o rustup instala o que ele pede).
      - name: Rust
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@v2

      # Debug primeiro: `debug_assert`, as checagens de overflow e o código
      # `cfg(debug_assertions)` só rodam aqui.
      - name: Testes (debug)
        run: cargo test --locked

      - name: Testes (release)
        run: cargo test --locked --release

      # Só reporta (sem -D warnings) até os avisos do M2 serem zerados.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Capturas desenhadas pelo código (FreeType + HarfBuzz)
        env:
          TASKBEAT_SHOTS_DIR: ${{ github.workspace }}/shots
          TASKBEAT_LANG: pt
        run: cargo test --release notch_shots -- --ignored --nocapture

      - name: Pacotes (.deb e AppImage)
        run: ./build-linux.sh

      - name: Conferência do pacote
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          ldd target/release/taskbeat
          objdump -T target/release/taskbeat | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          ls -l target/release/taskbeat

      - uses: actions/upload-artifact@v4
        with:
          name: Taskbeat-Linux
          path: |
            dist/*.deb
            dist/*.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: target/release/taskbeat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-code-shots
          path: shots/

  # Licenças, fontes e advisories das dependências (deny.toml). Só aqui: a
  # action é um contêiner Docker, que não roda nos runners de Windows e Mac.
  # Um advisory novo não quebra o PR (continue-on-error só nesse).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  shots:
    # O app de verdade numa distro atual: Sway sem tela (Wayland com
    # layer-shell) e Xvfb + picom (X11), com um player de teste no MPRIS.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: bin

      - uses: actions/download-artifact@v4
        with:
          name: Taskbeat-Linux
          path: dist

      - name: Dependências (só as de execução e as de teste)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libdbus-1-3 libpulse0 libfreetype6 libfontconfig1 libharfbuzz0b fonts-noto-core \
            sway grim wlrctl xvfb picom xdotool imagemagick pulseaudio pulseaudio-utils dbus-x11 python3-dbus python3-gi
          chmod +x bin/taskbeat

      - name: Pacote .deb instala
        run: |
          sudo apt-get install -y -q ./dist/*.deb
          dpkg -s taskbeat | head -5
          desktop-file-validate /usr/share/applications/io.github.lu1sgabriel.taskbeat.desktop || true

      - name: Prints e teste de ponta a ponta
        run: dbus-run-session -- bash linux/ci-shots.sh shots bin/taskbeat

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-shots
          path: shots/
