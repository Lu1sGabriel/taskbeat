name: macOS

on:
  push:
    branches: [macos]
  pull_request:
  workflow_dispatch:
  # Ao publicar uma release, o .dmg é gerado do tag e anexado a ela (job
  # `release`). Rodar à mão num tag (workflow_dispatch) refaz o anexo.
  release:
    types: [published]

# Só leitura por padrão; o job `release` pede escrita para anexar o .dmg.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --release

      - name: Capturas desenhadas pelo código (CoreText + SF Symbols)
        env:
          TASKBEAT_SHOTS_DIR: ${{ github.workspace }}/shots
          TASKBEAT_LANG: pt
        run: |
          cargo test --release notch_shots -- --ignored --nocapture
          cargo test --release mac_gifs -- --ignored --nocapture
          cargo test --release cover_shots -- --ignored --nocapture

      - name: App (.app universal + .dmg)
        run: ./build-macos.sh

      - name: Adaptador do Tocando Agora
        run: |
          APP=dist/Taskbeat.app
          /usr/bin/perl $APP/Contents/Resources/mediaremote-adapter.pl "$PWD/$APP/Contents/Frameworks/MediaRemoteAdapter.framework" get || echo "adaptador falhou: $?"
          codesign -dv --verbose=2 $APP 2>&1 | head -20

      - name: Compatibilidade (macOS 12+)
        run: |
          APP=dist/Taskbeat.app
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' $APP/Contents/Info.plist
          for f in $APP/Contents/MacOS/Taskbeat $APP/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter; do
            for a in arm64 x86_64; do
              m=$(otool -arch $a -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')
              echo "$f ($a): minos $m"
              [ "$m" = "12.0" ] || [ "$m" = "11.0" ] || { echo "minos inesperado"; exit 1; }
            done
          done
          # Funções do macOS 14.2+ não podem estar ligadas direto (o app não abriria no 12/13).
          if nm -u -arch arm64 $APP/Contents/MacOS/Taskbeat | grep -E 'ProcessTap'; then
            echo "símbolo do macOS 14.2+ ligado direto"; exit 1
          fi
          echo "ok"

      - name: Prints do app rodando
        run: macos/ci-shots.sh shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-shots
          path: shots/

      - uses: actions/upload-artifact@v4
        with:
          name: Taskbeat-macOS
          path: dist/*.dmg

  # Anexa o .dmg à release. Roda ao publicar uma release ou à mão num tag
  # `v*`; nos PRs e na branch `macos` o .dmg fica só como artefato.
  release:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Taskbeat-macOS
          path: dist

      - name: Confere o .dmg com o tag
        run: |
          # O nome vem do Cargo.toml (build-macos.sh); o tag tem que ser v<a mesma versão>.
          DMG="dist/Taskbeat-${TAG#v}.dmg"
          if [[ "$TAG" != v* || ! -f "$DMG" ]]; then
            echo "::error::$DMG não existe para o tag $TAG (gerado: $(ls dist)). O Cargo.toml está na versão do tag?"
            exit 1
          fi
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Anexa o .dmg à release
        run: gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"
