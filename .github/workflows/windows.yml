name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Só leitura: este workflow não publica nada.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        # bash para cada comando que falhar parar o passo (o pwsh do Actions
        # só olha o código de saída do último).
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # A versão vem do rust-toolchain.toml (o rustup instala o que ele pede).
      - name: Rust
        run: |
          rustup toolchain install
          rustc -V

      - uses: Swatinem/rust-cache@v2

      # Debug primeiro: `debug_assert`, as checagens de overflow e o código
      # `cfg(debug_assertions)` só rodam aqui.
      - name: Testes (debug)
        run: cargo test --locked

      - name: Testes (release)
        run: cargo test --locked --release

      # Só reporta (sem -D warnings) até os avisos do M2 serem zerados.
      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Capturas e GIFs desenhados pelo código (DirectWrite)
        env:
          TASKBEAT_SHOTS_DIR: ${{ github.workspace }}/shots
          TASKBEAT_LANG: pt
        run: |
          cargo test --release shots::shots -- --ignored --exact
          cargo test --release shots::readme_mixer -- --ignored --exact
          cargo test --release shots::widget_tints -- --ignored --exact
          cargo test --release demo_gif::demo_gif -- --ignored --exact
          cargo test --release lyrics_view::tests::lyrics_view_shots -- --ignored --exact

      - name: Instalador e extensão (sem assinatura)
        shell: pwsh
        run: ./build-installer.ps1 -NoSign

      - uses: actions/upload-artifact@v4
        with:
          name: Taskbeat-Windows
          path: |
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots/
