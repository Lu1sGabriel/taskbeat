<!doctype html>
<!-- Montagem das imagens da Chrome Web Store (make-images.ps1 tira o retrato).
     ?kind=shot (1280x800) ou tile (440x280); ?lang=pt ou en. -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    color: #f4f1fb;
    background:
      radial-gradient(60% 70% at 78% 40%, rgba(150, 90, 255, 0.35), transparent 70%),
      radial-gradient(50% 60% at 15% 85%, rgba(60, 110, 255, 0.30), transparent 70%),
      linear-gradient(135deg, #0d1230 0%, #23123f 55%, #2b0f32 100%);
  }
  .shot { display: grid; grid-template-columns: 520px 1fr; align-items: center; height: 800px; padding: 0 64px 0 80px; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: 0.2px; }
  .brand img { width: 52px; height: 52px; }
  h1 { font-size: 46px; line-height: 1.12; font-weight: 650; margin: 34px 0 30px; letter-spacing: -0.4px; }
  ul { list-style: none; display: grid; gap: 18px; }
  li { font-size: 21px; line-height: 1.35; color: #ddd6ee; padding-left: 30px; position: relative; }
  li::before { content: ""; position: absolute; left: 4px; top: 11px; width: 9px; height: 9px; border-radius: 50%; background: #c58cff; }
  .note { margin-top: 36px; font-size: 16px; color: #a99fc4; }
  .stage { position: relative; height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
  .card { width: 560px; filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.45)); }
  .bar { width: 600px; height: 60px; border-radius: 14px; background: rgba(22, 22, 26, 0.92); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35); }
  .bar img { width: 436px; }
  .tile { height: 280px; padding: 30px 30px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .brand { font-size: 30px; }
  .tile .brand img { width: 56px; height: 56px; }
  .tile p { font-size: 21px; line-height: 1.25; font-weight: 600; color: #efe9fb; }
  .tile .bar { width: 380px; height: 44px; border-radius: 11px; }
  .tile .bar img { width: 327px; }
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") || "en";
  const T = {
    pt: {
      h1: "O aleatório e o repetir do YouTube Music, de verdade, no Taskbeat",
      li: [
        "O estado real, lido da própria página: a bolinha embaixo do botão mostra o que está ligado",
        "Liga e desliga pelo widget, sem trazer o navegador para a frente",
        "Leve: só avisa quando algo muda, e nada sai do seu computador",
      ],
      note: "Precisa do Taskbeat para Windows (grátis e de código aberto).",
      tile: "Aleatório e repetir do YouTube Music na barra de tarefas",
    },
    en: {
      h1: "YouTube Music shuffle and repeat, for real, in Taskbeat",
      li: [
        "The real state, read from the page itself: the dot under the button shows what is on",
        "Toggle them from the widget without bringing the browser to the front",
        "Lightweight: it only speaks up when something changes, and nothing leaves your computer",
      ],
      note: "Requires Taskbeat for Windows (free and open source).",
      tile: "YouTube Music shuffle and repeat on your taskbar",
    },
  }[lang];
  const brand = `<div class="brand"><img src="../../icons/icon-128.png" alt="">Taskbeat</div>`;
  const bar = `<div class="bar"><img src="parts/store-widget.png" alt=""></div>`;
  if (q.get("kind") === "tile") {
    document.body.innerHTML = `<div class="tile">${brand}<p>${T.tile}</p>${bar}</div>`;
  } else {
    document.body.innerHTML = `<div class="shot"><div>${brand}<h1>${T.h1}</h1><ul>${T.li.map((t) => `<li>${t}</li>`).join("")}</ul><p class="note">${T.note}</p></div>
      <div class="stage"><img class="card" src="parts/store-card.png" alt="">${bar}</div></div>`;
  }
</script>
</body>
</html>
